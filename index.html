<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi 7 NIC Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070A11; --panel:#0D131E;
  --rule:#1E2A3C; --rule-hot:#2C3E58;
  --ink:#DBE3EE; --ink-dim:#7A8AA2; --ink-faint:#4A5769;
  --sig:#3FE0C8;
  --display:'Orbitron',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--void);color:var(--ink);overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}

.tabbar{display:flex;align-items:stretch;gap:4px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.brand{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);align-self:center;margin-right:20px;white-space:nowrap}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:13px 14px 11px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink-dim)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sig)}
.tab:focus-visible{outline:1px solid var(--rule-hot);outline-offset:-4px}

.links{margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:16px}
.link{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-dim);text-decoration:none;
  white-space:nowrap;padding:4px 9px;border:1px solid var(--rule-hot);border-radius:4px;transition:color .15s,border-color .15s}
.link:hover{color:var(--ink);border-color:var(--sig)}

.views{position:relative;min-height:0}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void)}
.views iframe[hidden]{display:none}

@media (max-width:600px){.brand{display:none}.tabbar{padding:0 8px}}
</style>
</head>
<body>
<nav class="tabbar" role="tablist" aria-label="Views">
  <span class="brand">Wi-Fi 7 NIC Explorer</span>
  <button class="tab" role="tab" id="tab-explorer" aria-controls="view-explorer" data-src="wifi7-nic-explorer.html" data-key="explorer">Packet Flow</button>
  <button class="tab" role="tab" id="tab-board" aria-controls="view-board" data-src="board-view.html" data-key="board">Board View</button>
  <button class="tab" role="tab" id="tab-scale" aria-controls="view-scale" data-src="scale-ladder.html" data-key="scale">Scale Ladder</button>
  <div class="links">
    <a class="link" href="https://github.com/AnnaVi11arrea1/wifi7_NIC_explorer" target="_blank" rel="noopener">Star on GitHub ⭐</a>
    <a class="link" href="https://www.buymeacoffee.com/stayfluorei" target="_blank" rel="noopener">☕ Buy me a coffee</a>
  </div>
</nav>
<main class="views">
  <iframe id="view-explorer" role="tabpanel" aria-labelledby="tab-explorer" title="Packet Flow" hidden></iframe>
  <iframe id="view-board" role="tabpanel" aria-labelledby="tab-board" title="Board View" hidden></iframe>
  <iframe id="view-scale" role="tabpanel" aria-labelledby="tab-scale" title="Scale Ladder" hidden></iframe>
</main>
<script>
const tabs = [...document.querySelectorAll('.tab')];

function select(tab, focus){
  tabs.forEach(t => {
    const on = t === tab;
    const frame = document.getElementById(t.getAttribute('aria-controls'));
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    frame.hidden = !on;
    // Load each view on first visit, then keep it alive so its state survives tab switches.
    if (on && !frame.src) frame.src = t.dataset.src;
  });
  if (focus) tab.focus();
  history.replaceState(null, '', '#' + tab.dataset.key);
}

tabs.forEach((t, i) => {
  t.addEventListener('click', () => select(t));
  t.addEventListener('keydown', e => {
    const step = {ArrowRight: 1, ArrowLeft: -1}[e.key];
    if (step) { e.preventDefault(); select(tabs[(i + step + tabs.length) % tabs.length], true); }
    if (e.key === 'Home') { e.preventDefault(); select(tabs[0], true); }
    if (e.key === 'End') { e.preventDefault(); select(tabs[tabs.length - 1], true); }
  });
});

const initial = tabs.find(t => '#' + t.dataset.key === location.hash) || tabs[0];
select(initial);
</script>
</body>
</html>

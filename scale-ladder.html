<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Ladder — One Ping, Internet to Transistor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070A11; --panel:#0D131E; --panel-2:#111926;
  --rule:#1E2A3C; --rule-hot:#2C3E58;
  --ink:#DBE3EE; --ink-dim:#7A8AA2; --ink-faint:#4A5769;
  --sig:#3FE0C8; --iface:#5B9DF0; --repr:#E8B34A; --prop:#E0559B;
  --display:'Orbitron',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden}

.shell{display:grid;grid-template-columns:96px minmax(0,1fr) 380px;height:100vh}

/* ---------- scale rail : the signature ---------- */
.rail{
  border-right:1px solid var(--rule);background:var(--panel);
  position:relative;display:flex;flex-direction:column;
  padding:18px 0;overflow-y:auto;
}
.rail-title{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-faint);
  text-align:center;margin-bottom:14px;
}
.tick{
  position:relative;flex:1;min-height:52px;cursor:pointer;
  border:none;background:transparent;color:var(--ink-faint);
  font-family:var(--mono);font-size:9px;letter-spacing:.04em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:0 4px;transition:color .2s;
}
.tick:hover{color:var(--ink-dim)}
.tick:focus-visible{outline:2px solid var(--sig);outline-offset:-2px}
.tick .dot{
  width:7px;height:7px;border-radius:50%;
  border:1px solid var(--rule-hot);background:var(--void);transition:all .25s;
}
.tick .mag{font-size:8.5px}
.tick .nm{font-size:8px;opacity:.75;text-align:center;line-height:1.25}
.tick[aria-current="true"]{color:var(--sig)}
.tick[aria-current="true"] .dot{
  background:var(--sig);border-color:var(--sig);
  box-shadow:0 0 12px -1px var(--sig);transform:scale(1.4);
}
.rail::before{
  content:"";position:absolute;left:50%;top:44px;bottom:18px;
  width:1px;background:var(--rule);transform:translateX(-.5px);
}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
.stage-head{
  padding:20px 26px 14px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.stage-head h1{
  font-family:var(--display);font-weight:700;font-size:16px;
  letter-spacing:.13em;text-transform:uppercase;margin:0;
}
.stage-head .mag{font-family:var(--mono);font-size:11px;color:var(--sig)}
.stage-head .ev{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;color:var(--void);
}
.ev[data-ev="public"]{background:var(--sig)}
.ev[data-ev="standard"]{background:var(--iface)}
.ev[data-ev="repr"]{background:var(--repr)}

.scenes{position:relative;flex:1;min-height:0}
.scene{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;opacity:0;pointer-events:none;
  transform:scale(.86);transition:opacity .42s ease,transform .42s ease;
}
.scene.active{opacity:1;transform:scale(1);pointer-events:auto}
.scene.above{transform:scale(1.5)}
.scene svg{width:100%;height:100%;max-height:100%;overflow:visible}

.zoomctl{
  border-top:1px solid var(--rule);padding:12px 26px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--panel-2);color:var(--ink);border:1px solid var(--rule-hot);
  border-radius:2px;padding:8px 14px;cursor:pointer;transition:.15s;
}
.btn:hover:not(:disabled){border-color:var(--sig);color:var(--sig)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.btn.hot{border-color:var(--sig);color:var(--sig)}
.hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto}

/* ---------- readout ---------- */
.readout{
  border-left:1px solid var(--rule);background:var(--panel);
  padding:22px 22px 40px;overflow-y:auto;
}
.readout h2{
  font-family:var(--display);font-weight:500;font-size:15px;
  letter-spacing:.05em;margin:0 0 3px;line-height:1.4;
}
.what{font-family:var(--mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:18px}
.blk{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.blk:last-child{border-bottom:none}
.lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.blk p{margin:0 0 8px;font-size:13.5px;line-height:1.62}
.blk p:last-child{margin-bottom:0}
.blk .dim{color:var(--ink-dim);font-size:12.5px}
.io{font-family:var(--mono);font-size:11.5px;color:var(--sig);line-height:1.7}
.check{background:rgba(224,85,155,.07);border-left:2px solid var(--prop);
  padding:10px 12px;font-size:12.5px;color:var(--ink-dim)}

/* ---------- svg atoms ---------- */
.f-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#7A8AA2;letter-spacing:.05em}
.f-lbl-s{font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:#4A5769}
.f-lbl-hot{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#3FE0C8}
.f-name{font-family:'Inter',sans-serif;font-size:12px;fill:#DBE3EE}
.box{fill:#0D131E;stroke:#2C3E58;stroke-width:1}
.box-hot{fill:#16233A;stroke:#3FE0C8;stroke-width:1.4}
.wire{stroke:#2C3E58;stroke-width:1.2;fill:none}
.wire-hot{stroke:#3FE0C8;stroke-width:1.6;fill:none}
.pkt{fill:#3FE0C8}

@keyframes flow{to{stroke-dashoffset:-24}}
.flowline{stroke-dasharray:5 7;animation:flow 1.1s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .shell{grid-template-columns:70px minmax(0,1fr)}
  .readout{position:fixed;inset:auto 0 0 0;height:44vh;border-left:none;border-top:1px solid var(--rule);z-index:5}
  .stage{padding-bottom:44vh}
}
</style>
</head>
<body>
<div class="shell">

  <nav class="rail" id="rail" aria-label="Scale levels">
    <div class="rail-title">Scale</div>
  </nav>

  <main class="stage">
    <div class="stage-head">
      <h1 id="lvlName">—</h1>
      <span class="mag" id="lvlMag"></span>
      <span class="ev" id="lvlEv" data-ev="public"></span>
    </div>
    <div class="scenes" id="scenes"></div>
    <div class="zoomctl">
      <button class="btn" id="zoomOut">− Zoom out</button>
      <button class="btn hot" id="zoomIn">+ Zoom in</button>
      <button class="btn" id="clockBtn" style="display:none">▸ Clock the register</button>
      <button class="btn" id="toggleBtn" style="display:none">▸ Toggle input</button>
      <span class="hint">↑ ↓ or scroll to change scale</span>
    </div>
  </main>

  <aside class="readout" id="readout"></aside>
</div>

   <text x="243" y="262" text-anchor="middle" class="f-lbl-s">adds redundancy</text>

   <text x="503" y="262" text-anchor="middle" class="f-lbl-s">bits → symbols</text>
   <text x="633" y="262" text-anchor="middle" class="f-lbl-s">symbols → waveform</text>
  </g>
 </svg>`
},
{
 id:"lfsr", name:"The scrambler", mag:"~10⁻⁴ m", ev:"standard", evLabel:"Public · IEEE 802.11",
 what:"7-stage LFSR · x⁷ + x⁴ + 1",
 lede:"Here the model stops being representative. This circuit is specified in the standard itself.",
 body:"Seven flip-flops in a chain. The outputs of stages 7 and 4 are combined by an XOR gate and fed back to the input. Clock it and the register walks through 127 distinct non-zero states before repeating — a repeatable pseudo-random bit sequence. Each data bit is XORed with one bit of that sequence. The receiver runs an identical register from the same seed and XORs again, which recovers the original bit exactly, because XORing twice with the same value returns you where you started.",
 io:"IN — one data bit per clock, plus a 7-bit seed\nOUT — one scrambled bit per clock",
 why:"Without it, a long run of identical bits would concentrate transmit energy into a few frequencies, which wastes amplifier headroom and can violate spectral requirements.",
 check:"Verify the polynomial and initialisation against the IEEE 802.11 document before publishing. This is the one level where an exact claim is being made, so it should rest on the primary source rather than on this model.",
 interactive:"lfsr",
 svg:null
},
{
 id:"gate", name:"One gate", mag:"~10⁻⁶ m", ev:"repr", evLabel:"Representative",
 what:"The XOR in the feedback path",
 lede:"The feedback XOR, opened up.",
 body:"XOR outputs 1 when its two inputs differ and 0 when they agree. In silicon it is not a primitive — it is built from simpler gates, most commonly four NANDs, or from a transmission-gate arrangement that uses fewer transistors. Each flip-flop in the register is likewise built from cross-coupled gates, arranged so the stored value can only change on a clock edge.",
 io:"IN — two logic levels, each a voltage near 0 V or near the supply\nOUT — one logic level",
 why:"XOR is the operation that makes the whole scrambler reversible. It is the only two-input function that is its own inverse.",
 check:"Which XOR implementation a given process uses is a design and library choice. The NAND construction shown is the classic teaching form, not a claim about any specific chip.",
 svg:`<svg viewBox="0 0 760 380">
  <text x="60" y="60" class="f-lbl-s">XOR FROM FOUR NAND GATES — the classic construction</text>
  <g>
   <path d="M170 120 h40 a30 30 0 0 1 0 60 h-40 z" class="box"/>
   <circle cx="216" cy="150" r="4" class="box"/>
   <text x="188" y="154" class="f-lbl-s">N1</text>

   <path d="M290 70 h40 a30 30 0 0 1 0 60 h-40 z" class="box"/>
   <circle cx="336" cy="100" r="4" class="box"/>
   <text x="308" y="104" class="f-lbl-s">N2</text>

   <path d="M290 190 h40 a30 30 0 0 1 0 60 h-40 z" class="box"/>
   <circle cx="336" cy="220" r="4" class="box"/>
   <text x="308" y="224" class="f-lbl-s">N3</text>

   <path d="M420 130 h40 a30 30 0 0 1 0 60 h-40 z" class="box-hot"/>
   <circle cx="466" cy="160" r="4" class="box-hot"/>
   <text x="436" y="164" class="f-lbl-hot">N4</text>

   <path d="M80 100 L170 100 L170 132" class="wire"/>
   <path d="M80 200 L170 200 L170 168" class="wire"/>
   <text x="60" y="104" class="f-lbl-hot">A</text>
   <text x="60" y="204" class="f-lbl-hot">B</text>

   <path d="M80 100 L260 100 L260 82 L290 82" class="wire"/>
   <path d="M220 150 L262 150 L262 118 L290 118" class="wire"/>
   <path d="M220 150 L262 150 L262 202 L290 202" class="wire"/>
   <path d="M80 200 L266 200 L266 238 L290 238" class="wire"/>

   <path d="M340 100 L390 100 L390 142 L420 142" class="wire"/>
   <path d="M340 220 L390 220 L390 178 L420 178" class="wire"/>
   <path d="M470 160 L560 160" class="wire-hot"/>
   <text x="572" y="164" class="f-lbl-hot">A ⊕ B</text>

   <rect x="600" y="90" width="120" height="140" class="box"/>
   <text x="660" y="112" text-anchor="middle" class="f-lbl-s">TRUTH</text>
   <text x="616" y="140" class="f-lbl-s">0  0  →  0</text>
   <text x="616" y="162" class="f-lbl-s">0  1  →  1</text>
   <text x="616" y="184" class="f-lbl-s">1  0  →  1</text>
   <text x="616" y="206" class="f-lbl-s">1  1  →  0</text>

   <text x="60" y="320" class="f-lbl-s">Every one of these NANDs is itself transistors. Zoom once more.</text>
  </g>
 </svg>`
},
{
 id:"cmos", name:"Transistors", mag:"~10⁻⁸ m", ev:"repr", evLabel:"Representative",
 what:"CMOS switching",
 lede:"The bottom of the ladder. Charge moves, and that is the whole story.",
 body:"The simplest CMOS structure is the inverter: a PMOS transistor to the supply and an NMOS to ground, gates tied together. Drive the input high and the NMOS conducts while the PMOS turns off, so the output is pulled to ground. Drive it low and the roles swap, pulling the output to the supply. Only one path conducts at a time, which is why CMOS burns almost no power holding a value and burns nearly all of it during the instant of switching.",
 io:"IN — a gate voltage\nOUT — an output pulled to supply or to ground",
 why:"Everything above this level — the ping, the internet, the whole radio — is this event, repeated billions of times per second across billions of devices.",
 check:"Feature size, process, threshold voltages, and device structure are entirely process-dependent. Nothing here is a claim about BE200's silicon.",
 interactive:"cmos",
 svg:null
}
];

/* ---------- build rail ---------- */
const rail=document.getElementById("rail");
LEVELS.forEach((L,i)=>{
  const b=document.createElement("button");
  b.className="tick"; b.dataset.i=i;
  b.setAttribute("aria-current","false");
  b.innerHTML=`<span class="mag">${L.mag}</span><span class="dot"></span><span class="nm">${L.name}</span>`;
  b.addEventListener("click",()=>go(i));
  rail.appendChild(b);
});

/* ---------- build scenes ---------- */
const scenes=document.getElementById("scenes");
LEVELS.forEach((L,i)=>{
  const d=document.createElement("div");
  d.className="scene"; d.dataset.i=i;
  if(L.svg) d.innerHTML=L.svg;
  scenes.appendChild(d);
  L.el=d;
});

/* ---------- LFSR scene ---------- */
const lfsrLevel=LEVELS.find(l=>l.interactive==="lfsr");
let reg=[1,0,1,1,1,0,1], outBits=[], dataBits="01001000";
let dataIdx=0;
function drawLFSR(){
  const cells=reg.map((v,i)=>{
    const x=70+i*84;
    return `<rect x="${x}" y="150" width="64" height="60" class="${v?'box-hot':'box'}"/>
      <text x="${x+32}" y="186" text-anchor="middle" class="${v?'f-lbl-hot':'f-lbl'}" style="font-size:19px">${v}</text>
      <text x="${x+32}" y="228" text-anchor="middle" class="f-lbl-s">${i+1}</text>
      ${i<6?`<path d="M${x+64} 180 L${x+84} 180" class="wire"/>`:""}`;
  }).join("");
  const dataBit=dataBits[dataIdx%8];
  const scrambleBit=reg[6]^reg[3];
  const outBit=(+dataBit)^scrambleBit;
  lfsrLevel.el.innerHTML=`<svg viewBox="0 0 760 380">
    <text x="70" y="60" class="f-lbl-s">FRAME SCRAMBLER · x⁷ + x⁴ + 1 · IEEE 802.11</text>
    ${cells}
    <circle cx="360" cy="290" r="18" class="box-hot"/>
    <text x="360" y="296" text-anchor="middle" class="f-lbl-hot" style="font-size:15px">⊕</text>
    <path d="M634 210 L634 290 L378 290" class="wire-hot"/>
    <path d="M322 290 L70 290 L70 210" class="wire-hot"/>
    <path d="M322 210 L322 268" class="wire-hot" stroke-dasharray="3 3"/>
    <text x="392" y="316" class="f-lbl-s">taps 7 and 4 · feedback to stage 1</text>
    <text x="70" y="118" class="f-lbl-s">register state</text>

    <rect x="70" y="330" width="620" height="0.5" fill="#1E2A3C"/>
    <text x="70" y="360" class="f-lbl">data bit
      <tspan class="f-lbl-hot">${dataBit}</tspan>
      <tspan class="f-lbl">  ⊕  scramble bit </tspan>
      <tspan class="f-lbl-hot">${scrambleBit}</tspan>
      <tspan class="f-lbl">  =  on air </tspan>
      <tspan class="f-lbl-hot" style="font-size:14px">${outBit}</tspan>
    </text>
    <text x="470" y="360" class="f-lbl-s">out: ${outBits.slice(-22).join("")||"—"}</text>
  </svg>`;
}
function clockLFSR(){
  const fb=reg[6]^reg[3];
  const dataBit=+dataBits[dataIdx%8];
  outBits.push(dataBit^fb);
  reg=[fb,...reg.slice(0,6)];
  dataIdx++;
  drawLFSR();
}

/* ---------- CMOS scene ---------- */
const cmosLevel=LEVELS.find(l=>l.interactive==="cmos");
let inHigh=false;
function drawCMOS(){
  const outHigh=!inHigh;
  const pOn=!inHigh, nOn=inHigh;
  cmosLevel.el.innerHTML=`<svg viewBox="0 0 760 380">
    <text x="200" y="46" class="f-lbl-s">CMOS INVERTER — one PMOS, one NMOS</text>

    <path d="M380 70 L380 120" class="${pOn?'wire-hot':'wire'}"/>
    <text x="392" y="76" class="f-lbl-s">VDD — supply</text>
    <path d="M340 70 L420 70" class="${pOn?'wire-hot':'wire'}"/>

    <rect x="350" y="120" width="60" height="60" class="${pOn?'box-hot':'box'}"/>
    <text x="380" y="156" text-anchor="middle" class="${pOn?'f-lbl-hot':'f-lbl'}">PMOS</text>
    <text x="424" y="150" class="f-lbl-s">${pOn?"conducting":"off"}</text>

    <path d="M380 180 L380 230" class="${outHigh?'wire-hot':'wire'}"/>

    <rect x="350" y="230" width="60" height="60" class="${nOn?'box-hot':'box'}"/>
    <text x="380" y="266" text-anchor="middle" class="${nOn?'f-lbl-hot':'f-lbl'}">NMOS</text>
    <text x="424" y="260" class="f-lbl-s">${nOn?"conducting":"off"}</text>

    <path d="M380 290 L380 330" class="${nOn?'wire-hot':'wire'}"/>
    <path d="M350 330 L410 330" class="${nOn?'wire-hot':'wire'}"/>
    <path d="M358 340 L402 340" class="${nOn?'wire-hot':'wire'}"/>
    <text x="392" y="362" class="f-lbl-s">GND</text>

    <path d="M180 205 L348 205" class="${inHigh?'wire-hot':'wire'}"/>
    <path d="M348 205 L348 150" class="${inHigh?'wire-hot':'wire'}"/>
    <path d="M348 205 L348 260" class="${inHigh?'wire-hot':'wire'}"/>
    <text x="120" y="210" class="${inHigh?'f-lbl-hot':'f-lbl'}" style="font-size:14px">IN ${inHigh?1:0}</text>

    <path d="M410 205 L600 205" class="${outHigh?'wire-hot':'wire'}"/>
    <text x="612" y="210" class="${outHigh?'f-lbl-hot':'f-lbl'}" style="font-size:14px">OUT ${outHigh?1:0}</text>

    <text x="120" y="300" class="f-lbl-s">only one path</text>
    <text x="120" y="316" class="f-lbl-s">conducts at a time</text>
  </svg>`;
}

/* ---------- navigation ---------- */
let cur=0;
const readout=document.getElementById("readout");
function go(i){
  i=Math.max(0,Math.min(LEVELS.length-1,i));
  cur=i;
  const L=LEVELS[i];
  LEVELS.forEach((l,j)=>{
    l.el.classList.toggle("active",j===i);
    l.el.classList.toggle("above",j<i);
  });
  document.querySelectorAll(".tick").forEach((t,j)=>t.setAttribute("aria-current",String(j===i)));
  document.getElementById("lvlName").textContent=L.name;
  document.getElementById("lvlMag").textContent=L.mag;
  const ev=document.getElementById("lvlEv");
  ev.textContent=L.evLabel; ev.dataset.ev=L.ev;

  readout.innerHTML=`
    <h2>${L.lede}</h2>
    <div class="what">${L.what}</div>
    <div class="blk"><div class="lbl">What happens here</div><p>${L.body}</p></div>
    <div class="blk"><div class="lbl">In / out</div><p class="io">${L.io.replace(/\n/g,"<br>")}</p></div>
    <div class="blk"><div class="lbl">Why it exists</div><p>${L.why}</p></div>
    <div class="blk"><div class="lbl">Reality check</div><p class="check">${L.check}</p></div>`;
  readout.scrollTop=0;

  document.getElementById("clockBtn").style.display=L.interactive==="lfsr"?"":"none";
  document.getElementById("toggleBtn").style.display=L.interactive==="cmos"?"":"none";
  document.getElementById("zoomIn").disabled=(i===LEVELS.length-1);
  document.getElementById("zoomOut").disabled=(i===0);
  if(L.interactive==="lfsr") drawLFSR();
  if(L.interactive==="cmos") drawCMOS();
}
document.getElementById("zoomIn").addEventListener("click",()=>go(cur+1));
document.getElementById("zoomOut").addEventListener("click",()=>go(cur-1));
document.getElementById("clockBtn").addEventListener("click",clockLFSR);
document.getElementById("toggleBtn").addEventListener("click",()=>{inHigh=!inHigh;drawCMOS();});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();go(cur+1);}
  if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();go(cur-1);}
});
let wheelLock=false;
document.querySelector(".stage").addEventListener("wheel",e=>{
  if(wheelLock) return;
  wheelLock=true; setTimeout(()=>wheelLock=false,520);
  go(cur+(e.deltaY>0?1:-1));
},{passive:true});

go(0);
</script>
</body>
</html>
